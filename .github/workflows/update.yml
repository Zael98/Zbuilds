# Daily: refresh the builds from the sites; if any changed, commit, tag and publish a release
# (GitHub release for WowUp/manual installs, and CurseForge when the CF_API_KEY secret is set).
# Pushing a v* tag by hand publishes that version the same way.
name: Actualizar builds

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  issues: write

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar builds
        run: python tools/update_builds.py

      # a site that fails or stops giving builds keeps yesterday's copy, so nothing breaks in game:
      # say so in one open issue (GitHub mails the owner) instead of failing silently
      - name: Avisar de fuentes con problemas
        if: hashFiles('tools/problems.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s tools/problems.txt ] || exit 0
          title="Fuentes con problemas"
          body="$(printf 'El actualizador del %s no pudo leer bien estas fuentes (se mantiene la copia anterior):\n\n```\n%s\n```' "$(date -u +%Y-%m-%d)" "$(cat tools/problems.txt)")"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Guardar y etiquetar si cambiaron
        id: commit
        run: |
          if git diff --quiet -- Data.lua; then
            echo "Sin cambios en las builds"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data.lua tools/cache.json
          git commit -m "Actualizar builds $(date -u +%Y-%m-%d)"
          tag="v$(date -u +%Y.%m.%d.%H%M)"
          git tag "$tag"
          git push origin HEAD "$tag"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publicar versión
        if: steps.commit.outputs.changed == 'true'
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publicar versión
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
